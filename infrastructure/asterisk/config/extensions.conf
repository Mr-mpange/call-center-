[general]
static=yes
writeprotect=no
clearglobalvars=no

[globals]

; Authenticated local SIP test endpoint. 5551000 exercises a real RTP echo
; through Asterisk. Every other number is a trusted inbound DID and is handed
; to the ARI call-center application with the dialplan context attached.
[from-test-sip]
exten => 5551000,1,NoOp(Local SIP/RTP echo verification)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => 5551001,1,NoOp(Local inbound call-center test DID)
 same => n,Stasis(call-center,inbound,${EXTEN},${CALLERID(num)},${CONTEXT})
 same => n,Hangup()
exten => 5551002,1,NoOp(Local SIP-to-WebRTC media test)
 same => n,Dial(PJSIP/local_agent,20)
 same => n,Hangup()
exten => _X.,1,NoOp(Local inbound call-center DID ${EXTEN})
 same => n,Stasis(call-center,inbound,${EXTEN},${CALLERID(num)},${CONTEXT})
 same => n,Hangup()

; Production inbound trunk context. The provider's source validation belongs
; in PJSIP identify rules / the host firewall; the Stasis call still resolves
; the tenant from the trusted called DID, never from a browser parameter.
[from-at-trunk]
exten => _X.,1,NoOp(Inbound provider SIP call)
 same => n,Stasis(call-center,inbound,${EXTEN},${CALLERID(num)},${CONTEXT})
 same => n,Hangup()

; Browser agent endpoints may only run the local echo diagnostic. Direct
; dialing a business DID is rejected so a registered browser cannot inject a
; fake inbound call and bypass backend authorization.
[from-webrtc]
exten => 5551000,1,NoOp(Local browser media diagnostic)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
exten => _X.,1,NoOp(Blocked direct browser dialing to ${EXTEN})
 same => n,Hangup(21)

openapi: 3.0.3
info:
  title: Mpange Call Center API
  version: 1.0.0
  description: >-
    Voice callbacks, outbound calls, persisted call-event logs, and dashboard-managed
    IVR flows for Mpange Call Center.
servers:
  - url: https://your-public-domain
    description: Replace with your deployed API or ngrok HTTPS URL.
tags:
  - name: Voice callbacks
    description: Endpoints called by Africa's Talking.
  - name: Voice calls
    description: Start outbound calls.
  - name: Call logs
    description: Dashboard access to persisted Africa's Talking voice events.
  - name: IVR flows
    description: Dashboard management of each business's keypad menu.
  - name: Business management
    description: Dashboard onboarding of businesses and management of their agents.
paths:
  /voice/actions:
    post:
      tags: [Voice callbacks]
      summary: Voice callback and call-flow instructions
      description: >-
        Configure this URL as the callback URL for each Africa's Talking voice
        number. The app routes inbound calls by destination number and executes
        a saved business IVR flow when one exists.
      operationId: voiceActions
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceCallback'
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceCallback'
      responses:
        '200':
          description: VoiceXML instructions for Africa's Talking.
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <Response>
                  <Say>Welcome to Mpanges Support. Please hold while we connect your call.</Say>
                  <Dial phoneNumbers="+255683859574,+255720787987" callerId="+255699920003"/>
                </Response>
        '500':
          description: Call routing or IVR configuration could not be loaded.
  /voice/inbound:
    post:
      tags: [Voice callbacks]
      summary: Alias for the voice callback
      operationId: voiceInboundAlias
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceCallback'
      responses:
        '200':
          description: VoiceXML instructions.
          content:
            application/xml:
              schema:
                type: string
  /voice/events:
    post:
      tags: [Voice callbacks]
      summary: Receive and persist call status events
      description: Configure this as the Africa's Talking Events URL.
      operationId: receiveVoiceEvent
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VoiceEvent'
          application/json:
            schema:
              $ref: '#/components/schemas/VoiceEvent'
      responses:
        '200':
          description: Event saved.
          content:
            text/plain:
              schema:
                type: string
                example: OK
        '500':
          description: Event could not be persisted.
  /voice/call:
    post:
      tags: [Voice calls]
      summary: Start an outbound call
      operationId: startVoiceCall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundCallRequest'
            example:
              callFrom: '+255699920003'
              callTo: '+255683859574'
      responses:
        '200':
          description: Africa's Talking accepted the call request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  result:
                    type: object
                    additionalProperties: true
        '400':
          description: Missing or invalid call numbers.
        '502':
          description: Africa's Talking rejected the request or could not be reached.
  /voice/outbound:
    post:
      tags: [Voice calls]
      summary: Alias for starting an outbound call
      operationId: startVoiceCallAlias
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundCallRequest'
      responses:
        '200':
          description: Africa's Talking accepted the call request.
        '400':
          description: Missing or invalid call numbers.
        '502':
          description: Africa's Talking rejected the request or could not be reached.
  /voice/logs:
    get:
      tags: [Call logs]
      summary: List persisted voice events
      operationId: listVoiceLogs
      security:
        - DashboardBearer: []
      parameters:
        - name: limit
          in: query
          description: Number of event records to return (1–100; default 25).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: sessionId
          in: query
          schema:
            type: string
        - name: direction
          in: query
          schema:
            type: string
            enum: [Inbound, Outbound]
        - name: status
          in: query
          schema:
            type: string
        - name: callerNumber
          in: query
          schema:
            type: string
        - name: destinationNumber
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated voice event records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceLogList'
        '401':
          description: Missing or invalid dashboard bearer key.
        '503':
          description: Dashboard key is not configured.
  /voice/logs/{sessionId}:
    get:
      tags: [Call logs]
      summary: Get all saved events for a call session
      operationId: getVoiceLog
      security:
        - DashboardBearer: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Event history for the call.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  sessionId:
                    type: string
                  eventCount:
                    type: integer
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/VoiceEventRecord'
        '404':
          description: Call session not found.
        '401':
          description: Missing or invalid dashboard bearer key.
  /voice/businesses:
    get:
      tags: [Business management]
      summary: List onboarded businesses
      operationId: listBusinesses
      security:
        - DashboardBearer: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Businesses and their agents.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  businesses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Business'
        '401':
          description: Missing or invalid dashboard bearer key.
    post:
      tags: [Business management]
      summary: Onboard a business
      operationId: createBusiness
      security:
        - DashboardBearer: []
      description: The tenantId in the request body scopes this operation to an existing tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessInput'
            example:
              id: mpange
              tenantId: tenant-example
              name: Mpange Support
              numbers: ['+255699920003']
              routing: parallel
      responses:
        '201':
          description: Business created.
        '400':
          description: Invalid business data.
        '409':
          description: Business ID already exists.
  /voice/businesses/{businessId}:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
    get:
      tags: [Business management]
      summary: Get a business with its agents
      operationId: getBusiness
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: Business details.
        '404':
          description: Business not found.
    put:
      tags: [Business management]
      summary: Update business details and routing mode
      operationId: updateBusiness
      security:
        - DashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessUpdate'
      responses:
        '200':
          description: Business updated.
        '400':
          description: Invalid business data.
        '404':
          description: Business not found.
    delete:
      tags: [Business management]
      summary: Remove a business
      operationId: deleteBusiness
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: Business and its IVR flow removed.
        '404':
          description: Business not found.
  /voice/businesses/{businessId}/agents:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
    post:
      tags: [Business management]
      summary: Add an agent to a business
      operationId: addBusinessAgent
      security:
        - DashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInput'
            example:
              name: Agent One
              number: '+255700000001'
      responses:
        '201':
          description: Agent added.
        '400':
          description: Invalid agent data.
        '404':
          description: Business not found.
        '409':
          description: Agent number already belongs to this business.
  /voice/businesses/{businessId}/agents/{agentId}:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    put:
      tags: [Business management]
      summary: Update a business agent
      operationId: updateBusinessAgent
      security:
        - DashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentInput'
      responses:
        '200':
          description: Agent updated.
        '404':
          description: Business or agent not found.
    delete:
      tags: [Business management]
      summary: Remove an agent from a business
      operationId: deleteBusinessAgent
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: Agent removed.
        '404':
          description: Business or agent not found.
  /voice/businesses/{businessId}/agents/{agentId}/capability-token:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: query
        required: true
        schema:
          type: string
      - name: agentId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Business management]
      summary: Issue a short-lived WebRTC token to a browser agent
      description: Call from a trusted dashboard backend after authenticating the agent. Never expose dashboard or Africa's Talking API keys in browser code.
      operationId: createWebAgentCapabilityToken
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: WebRTC capability token and browser client details.
        '400':
          description: Agent is not configured as a web agent.
        '404':
          description: Business or agent not found.
        '502':
          description: Africa's Talking token request failed.
  /voice/ivr/flows:
    get:
      tags: [IVR flows]
      summary: List saved IVR flows
      operationId: listIvrFlows
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: IVR flows keyed by business ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  flows:
                    type: object
                    additionalProperties:
                      $ref: '#/components/schemas/IvrFlow'
        '401':
          description: Missing or invalid dashboard bearer key.
    post:
      tags: [IVR flows]
      summary: Create or replace a business IVR flow
      operationId: createIvrFlow
      security:
        - DashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/IvrFlow'
                - type: object
                  required: [businessId]
                  properties:
                    businessId:
                      type: string
            example:
              businessId: Mpnge
              greeting: Welcome to Mpanges Support.
              menuPrompt: Press 1 to speak to an agent. Press 2 for opening hours. Press 0 to end the call.
              timeoutSeconds: 15
              options:
                - digit: '1'
                  label: Speak to an agent
                  action: dialAgents
                - digit: '2'
                  label: Opening hours
                  action: say
                  text: We are open Monday to Friday, from 8 AM to 5 PM.
                - digit: '0'
                  label: End call
                  action: hangup
                  text: Thank you for calling.
      responses:
        '201':
          description: Flow saved.
        '400':
          description: Invalid flow or business ID.
        '401':
          description: Missing or invalid dashboard bearer key.
  /voice/ivr/flows/{businessId}:
    parameters:
      - name: businessId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [IVR flows]
      summary: Get one business IVR flow
      operationId: getIvrFlow
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: IVR flow.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  businessId:
                    type: string
                  flow:
                    $ref: '#/components/schemas/IvrFlow'
        '404':
          description: Flow not found.
    put:
      tags: [IVR flows]
      summary: Replace a business IVR flow
      operationId: updateIvrFlow
      security:
        - DashboardBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IvrFlow'
      responses:
        '200':
          description: Flow updated.
        '400':
          description: Invalid flow or business ID.
        '401':
          description: Missing or invalid dashboard bearer key.
    delete:
      tags: [IVR flows]
      summary: Delete a business IVR flow
      operationId: deleteIvrFlow
      security:
        - DashboardBearer: []
      responses:
        '200':
          description: Flow deleted; business returns to direct-to-agent routing.
        '404':
          description: Flow not found.
components:
  securitySchemes:
    DashboardBearer:
      type: http
      scheme: bearer
      bearerFormat: VOICE_DASHBOARD_API_KEY
  schemas:
    VoiceCallback:
      type: object
      properties:
        callSessionState:
          type: string
          example: Ringing
        direction:
          type: string
          enum: [Inbound, Outbound]
        callerNumber:
          type: string
          example: '+255618075896'
        destinationNumber:
          type: string
          example: '+255699920003'
        sessionId:
          type: string
        isActive:
          type: string
          enum: ['0', '1']
        dtmfDigits:
          type: string
          description: Key pressed by the caller in an IVR flow.
    VoiceEvent:
      type: object
      additionalProperties: true
      properties:
        callSessionState:
          type: string
          example: Bridged
        direction:
          type: string
          example: Inbound
        callerNumber:
          type: string
        destinationNumber:
          type: string
        dialDestinationNumbers:
          type: string
        dialDestinationNumber:
          type: string
        sessionId:
          type: string
        status:
          type: string
        hangupCause:
          type: string
        lastBridgeHangupCause:
          type: string
        durationInSeconds:
          type: string
        amount:
          type: string
        currencyCode:
          type: string
    VoiceEventRecord:
      allOf:
        - $ref: '#/components/schemas/VoiceEvent'
        - type: object
          properties:
            receivedAt:
              type: string
              format: date-time
    VoiceLogList:
      type: object
      properties:
        ok:
          type: boolean
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        records:
          type: array
          items:
            $ref: '#/components/schemas/VoiceEventRecord'
    OutboundCallRequest:
      type: object
      required: [callTo]
      properties:
        callFrom:
          type: string
          description: Africa's Talking voice number assigned to the organization. Required for direct /voice/call requests; tenant dashboard calls resolve it from the organization's telephony configuration.
          example: '+255699920003'
        callTo:
          oneOf:
            - type: string
              description: One E.164 number or comma-separated E.164 numbers.
            - type: array
              items:
                type: string
          example: '+255683859574'
        clientRequestId:
          type: string
    IvrFlow:
      type: object
      required: [greeting, menuPrompt, options]
      properties:
        greeting:
          type: string
        menuPrompt:
          type: string
        timeoutSeconds:
          type: integer
          minimum: 3
          maximum: 60
          default: 15
        options:
          type: array
          minItems: 1
          items:
            type: object
            required: [digit, action]
            properties:
              digit:
                type: string
                pattern: '^[0-9]$'
              label:
                type: string
              action:
                type: string
                enum: [dialAgents, say, hangup]
              text:
                type: string
                description: Required for say; optional for hangup.
    BusinessInput:
      type: object
      required: [id, tenantId, name, numbers]
      properties:
        tenantId:
          type: string
          description: Existing tenant ID that owns this business route.
        id:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,64}$'
        name:
          type: string
        numbers:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^\+[1-9][0-9]{7,14}$'
        routing:
          type: string
          enum: [parallel, sequential]
          default: parallel
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentInput'
    BusinessUpdate:
      type: object
      required: [name, numbers, routing]
      properties:
        name:
          type: string
        numbers:
          type: array
          minItems: 1
          items:
            type: string
            pattern: '^\+[1-9][0-9]{7,14}$'
        routing:
          type: string
          enum: [parallel, sequential]
    Business:
      allOf:
        - $ref: '#/components/schemas/BusinessInput'
        - type: object
          properties:
            agents:
              type: array
              items:
                $ref: '#/components/schemas/Agent'
    AgentInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [phone, web]
          default: phone
        number:
          type: string
          pattern: '^\+[1-9][0-9]{7,14}$'
          description: Required when type is phone.
        clientName:
          type: string
          pattern: '^[A-Za-z0-9_-]{2,64}$'
          description: Required when type is web; identifies the browser agent for call routing.
    Agent:
      allOf:
        - $ref: '#/components/schemas/AgentInput'
        - type: object
          required: [id]
          properties:
            id:
              type: string
